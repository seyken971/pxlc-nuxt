name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# contents: read au niveau global (checkout dans build).
# pages: write + id-token: write limités au job deploy uniquement.
permissions:
  contents: read

# Groupe scopé par ref pour que les PRs Dependabot ne s'annulent pas mutuellement
# ni le run main. cancel-in-progress conditionnel à la ref :
#   - main = déploiement de production : on NE coupe JAMAIS un run en cours,
#     sinon actions/deploy-pages émet « Deployment cancelled ». Les pushes main
#     successifs se mettent en file au lieu de s'annuler — le dernier gagne.
#   - PR / branches : on garde l'annulation des runs redondants (économie CI).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Historique complet : les <lastmod> des pages statiques du sitemap
          # viennent de la date du dernier commit touchant chaque page
          # (scripts/sitemap-lastmod.mjs). Sur le clone superficiel par défaut,
          # cette date est introuvable et tout retombe sur l'horodatage du
          # build — le signal qu'on cherche justement à ne plus envoyer.
          fetch-depth: 0

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Cache du build Astro (transforms astro:assets notamment — les webp
      # regénérés sinon à chaque run). Le préfixe astro-v1- est un bust manuel.
      - name: Cache Astro build artefacts
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.cache
            .astro
          key: astro-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}
          restore-keys: |
            astro-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint (ESLint)
        # Flat config autonome (astro + vue + typescript-eslint). Rapide —
        # tourne avant les étapes lourdes pour échouer vite.
        run: npm run lint

      - name: Typecheck (astro check)
        run: npm run typecheck

      - name: Build static site (gates + Astro + post-build SEO)
        # `npm run build` déclenche les hooks npm :
        #   prebuild  = gen:tokens → design → ds-lint
        #   build     = astro build (24 pages statiques dans dist/)
        #   postbuild = check-links
        run: npm run build

      - name: Verify build output
        # Cheap guardrail — if the build produced an empty dist/ or the home
        # page is missing, fail loud instead of uploading a broken artefact.
        run: |
          test -f dist/index.html || { echo "::error::Missing dist/index.html"; exit 1; }
          test -f dist/sitemap-index.xml || { echo "::error::Missing sitemap-index.xml"; exit 1; }
          test -f dist/robots.txt || { echo "::error::Missing robots.txt"; exit 1; }
          test -f dist/.nojekyll || { echo "::error::Missing .nojekyll"; exit 1; }
          test -f dist/CNAME || { echo "::error::Missing CNAME"; exit 1; }

      - name: A11y audit — static (axe-core + jsdom)
        # Fast check on the prerendered HTML. Catches semantic regressions
        # (labels, landmarks, ARIA) but can't see contrast or layout.
        run: npm run a11y

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        # --with-deps adds the OS-level libs Chromium needs on Ubuntu;
        # the binary itself comes from cache on hit. ~150 MB cold, ~5 s warm.
        #
        # Le 19/08/2026, cette étape s'est figée sans fin sur 2 runs sur 3
        # (plus de 35 min, jusqu'à bloquer le déploiement de main). En cause :
        # l'apt-get lancé par --with-deps, qui attend une réponse interactive.
        # D'où les deux variables ci-dessous. Le timeout est le filet de
        # sécurité — un blocage doit échouer vite, pas geler le job pendant
        # les 6 h du timeout par défaut d'Actions.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: npx playwright install chromium --with-deps

      - name: A11y audit — runtime (axe-core + headless Chromium)
        # Complements the static check with the rules that need a real
        # browser: color-contrast, target-size, focus visibility, plus
        # dynamic states (mobile menu open, FAQ open).
        run: npm run a11y:runtime

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # continue-on-error : un échec transitoire de Pages (statut `error`
        # immédiat ou `deployment_queued` jusqu'au timeout) ne fait pas tomber
        # le job — l'étape de retry ci-dessous relance un déploiement propre.
        continue-on-error: true

      # Retry unique. `steps.deployment.outcome` reflète le résultat réel de
      # l'étape (`failure`) même quand `continue-on-error` masque son
      # `conclusion` en `success`. Pas de continue-on-error ici : un second
      # échec fait tomber le job, on ne masque donc pas une vraie panne Pages.
      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
