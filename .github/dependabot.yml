version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript"
          - "typescript-eslint"
      testing:
        patterns:
          - "playwright"
          - "@axe-core/*"
          - "axe-core"
          - "lighthouse"
          - "jsdom"
          - "chrome-launcher"
